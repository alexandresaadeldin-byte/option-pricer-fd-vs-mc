[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pricing"
version = "0.1.0"
description = "Cross-validated option pricer: finite differences vs Monte Carlo"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "numba", "pandas", "plotly", "streamlit"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
include = ["pricing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
